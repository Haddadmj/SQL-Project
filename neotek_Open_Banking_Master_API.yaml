        averageMonthlyExpenses:
          type: number
          format: decimal
          example: 8500
        averageMonthlyLoanPayment:
          type: number
          format: decimal
          example: 2500
        monthlySurplus:
          type: number
          format: decimal
          example: 4000
        debtToIncomeRatio:
          type: number
          format: decimal
