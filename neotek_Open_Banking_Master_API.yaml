          $ref: '#/components/schemas/single_api_aggregator_CreditorAccount'
    single_api_aggregator_PsuInquiry_CreditorAgent:
      type: object
      required:
      - IdentificationType
      - Identification
      description: 'Party that manages the account on behalf of the account owner, that is manages the registration and booking of entries on the account, calculates balances on the account and provides information about the account.

        This is the servicer of the beneficiary account.'
      properties:
        IdentificationType:
          $ref: '#/components/schemas/single_api_aggregator_IdentificationType_1'
        Identification:
          $ref: '#/components/schemas/single_api_aggregator_Identification_1'
    single_api_aggregator_IdentificationType_1:
      title: IdentificationType_1
      description: 'Refers to the identification scheme for uniquely identifying the Creditor Agent.

        '
      type: string
      enum:
      - KSAOB.BICFI
      - KSAOB.OTHER
    single_api_aggregator_Identification_1:
      title: Identification_1
      description: Unique and unambiguous identification of the servicing institution.
      type: string
      minLength: 1
      maxLength: 35
    single_api_aggregator_DebtorReference:
      description: A reference value provided by the PSU to the PISP while setting up the scheduled payment.
      type: string
      minLength: 1
      maxLength: 35
    single_api_aggregator_ScheduledPaymentId:
      description: A unique and immutable identifier used to identify the scheduled payment resource. This identifier has no meaning to the account owner.
      type: string
      minLength: 1
      maxLength: 40
    single_api_aggregator_ScheduleTypeCode:
      description: "Specifies the type of scheduled payment date provided under ScheduledPaymentDateTime. \n  Encoded with allowable values of:\n  \"Arrival\" - PSU1 specifies the date for the arrival of funds in the beneficiary (Creditor) account\n  \"Execution\" - PSU1 specifies the date which the payment needs to be executed from the PSU 1 (Debtor) account.\n"
      type: string
      enum:
      - KSAOB.Arrival
    single_api_aggregator_CreditorReference:
      description: 'Unique reference, as assigned by the creditor, to unambiguously refer to the payment transaction.

        Usage: If available, the initiating party should provide this reference in the structured remittance information, to enable reconciliation by the creditor upon receipt of the amount of money.

        If the business context requires the use of a creditor reference or a payment remit identification, and only one identifier can be passed through the end-to-end chain, the creditor''s reference or payment remittance identification should be quoted in the end-to-end transaction identification.'
      type: string
      minLength: 1
      maxLength: 35
    single_api_aggregator_CreditorAccount:
      type: array
      items:
        $ref: '#/components/schemas/single_api_aggregator_PsuInquiry_CreditorAccountItem'
    single_api_aggregator_PsuInquiry_CreditorAccountItem:
      required:
