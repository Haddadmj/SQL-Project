  parameters:
    single_api_aggregator_x-request-id:
      in: header
      name: x-request-id
      required: false
      description: An RFC4122 UID used as a correlation id.
      schema:
        type: string
        example: 52671b0e-b627-4723-acff-642618b3bfc2
    single_api_aggregator_PSUId:
      name: PSUId
      in: query
      required: true
      description: The ID of the Payment Services User (PSU).
      schema:
        type: string
        example: '1234567895'
    single_api_aggregator_ProfileId:
      in: query
      name: ProfileId
      required: false
      description: The ID of the profile that contains the Accounts Link(s) added by the PSU to the current profile.
      schema:
        type: string
    single_api_aggregator_FinancialInstitutionId:
      name: FinancialInstitutionId
      in: query
      required: false
      description: The ID of the financial institution with which the PSU may have established Accounts Link(s).
      schema:
        type: string
        example: SAMAModelBank
    single_api_aggregator_FinancialInstitutionName:
      name: FinancialInstitutionName
      in: query
      required: false
      description: The name of the financial institution with which the PSU may have established Accounts Link(s).
      schema:
        type: string
        example: Alinma Bank
    single_api_aggregator_AccountsLinkId:
      name: AccountsLinkId
      in: query
      required: false
      description: "The ID associated with the Accounts Link, an abstraction layer over OB consent. \nThis ID is used in the Authorization Gateway, a Neotek product that simplifies \nOpen Banking by abstracting its specifications and FAPI regulations."
      schema:
        type: string
        example: '1234567895'
    single_api_aggregator_AccountId:
      name: AccountId
      in: query
      required: false
      description: "The unique ID for a specific account held by a PSU in a financial institution. \nThis ID is used to manage and retrieve information related to the specific account through OB APIs."
      schema:
        type: string
        example: '1234567895'
    single_api_aggregator_AccountStatus:
      name: Status
      in: query
      required: false
      description: "Filter by the status of accounts in code form. \n- Active: It means that the account is active and exists.\n- NotActive: It means that the account has been not active for 6 to 12 months.\n- Dormant: It means that the accounts has been Inactive for 1 to 5 years.\n- Unclaimed: It means that the accounts has been Inactive for more than 5 years.\n- Deceased: Indicates that the account holder has passed away.\n- Suspended: If the account is suspended do to any reason. E.g: SAMA requested the bank to suspend the account for security reason.\n- Closed: If the account is closed\n"
      schema:
        type: string
        example: Active
        enum:
        - Active
        - NotActive
        - Dormant
        - Unclaimed
        - Deceased
        - Suspended
        - Closed
    single_api_aggregator_Currency:
      name: Currency
      in: query
      required: false
      description: "Identification of the currency in which the account is held. \nA code allocated to a currency under an international currency identification scheme, \nas described in the latest edition of the international standard ISO 4217 'Codes for the representation of currencies and funds'."
      schema:
        type: string
        example: SAR
    single_api_aggregator_AccountType:
      name: AccountType
      in: query
      required: false
      description: Filter by the type of accounts.
      schema:
        type: string
        example: KSAOB.Retail
        enum:
        - KSAOB.Retail
        - KSAOB.Corporate
    single_api_aggregator_AccountSubType:
      name: AccountSubType
      in: query
      required: false
      description: Filter by the sub type of accounts (product family group).
      schema:
        type: string
        example: CurrentAccount
        enum:
        - CurrentAccount
        - Savings
        - CreditCard
        - PrePaidCard
        - EMoney
        - ChargeCard
        - Other
    single_api_aggregator_FromOpeningDate:
      name: FromOpeningDate
      in: query
      required: false
      description: It sets a lower date-time limit for filtering accounts by opening date.
      schema:
        type: string
        format: date-time
        example: '2022-03-05T08:20:37.034Z'
    single_api_aggregator_ToOpeningDate:
      name: ToOpeningDate
      in: query
      required: false
      description: It sets an upper date-time limit for filtering accounts by opening date.
      schema:
        type: string
        format: date-time
        example: '2024-03-05T08:20:37.034Z'
    single_api_aggregator_AccountOrder:
      name: Order
      in: query
      required: false
      description: Sort/Order accounts by opening date
      schema:
        type: string
        example: DESC
        default: DESC
        enum:
        - ASC
        - DESC
    single_api_aggregator_IncludeBalancesFlag:
      name: IncludeBalancesFlag
      in: query
      required: false
      description: IncludeBalancesFlag is a boolean flag used to specify whether to include balance information for each account.
      schema:
        type: boolean
        example: true
    single_api_aggregator_BalanceType:
      name: BalanceType
      in: query
      required: false
      description: "Filter by the type of balance for the account. \nEncoded with allowable values of: \n* 'ClosingAvailable' - end of day balance specifying the amount available to PSU 1 to withdraw or use. \n* 'ClosingBooked' - end of day balance including value of payments for cheques or payments which have not been cleared yet. \n* 'ClosingCleared' - end of day balance including value of payments for cheques or payments which have been cleared. \n* 'Expected' - intra day balance including value of payments for cheques or payments which have been cleared. \n* 'ForwardAvailable' - intraday balance specifying the amount available to PSU 1 to withdraw or use considering forward dated payments or other intraday payments or cheques that will be clearing to the account. \n* 'Information' - TBC. \n* 'InterimAvailable' - intraday balance specifying the amount available to PSU 1 to withdraw or use (most probably real-time.'InterimBooked' - intraday balance including value of payments for cheques\
        \ or payments which have not been cleared yet. \n* 'InterimCleared' - intraday balance including value of payments for cheques or payments which have been cleared (probably real-time). \n* 'OpeningAvailable' - start of day balance specifying the amount available to PSU 1 to withdraw or use. \n* 'OpeningBooked' - start of day balance including value of payments for cheques or payments which have not been cleared yet. \n* 'OpeningCleared' - start of day balance including value of payments for cheques or payments which have been cleared.\n* 'PreviouslyClosedBooked' -TBC. \n\nNote: PASPs support different types for presenting account balance, so this list is used to support different PASP systems in KSA.\n"
      schema:
        type: string
        example: KSAOB.ClosingAvailable
        enum:
        - KSAOB.ClosingAvailable
        - KSAOB.ClosingBooked
        - KSAOB.ClosingCleared
        - KSAOB.Expected
        - KSAOB.ForwardAvailable
        - KSAOB.Information
        - KSAOB.InterimAvailable
        - KSAOB.InterimBooked
        - KSAOB.InterimCleared
        - KSAOB.OpeningAvailable
        - KSAOB.OpeningBooked
        - KSAOB.OpeningCleared
        - KSAOB.PreviouslyClosedBooked
    single_api_aggregator_BalanceAmountType:
      name: BalanceAmountType
      in: query
      required: false
      description: "A number of monetary units specified in an active currency where the unit of \ncurrency is explicit and compliant with ISO 4217."
      schema:
        type: string
        example: KSAOB.Credit
        enum:
        - KSAOB.Credit
        - KSAOB.Debit
    single_api_aggregator_FromAmount:
      name: FromAmount
