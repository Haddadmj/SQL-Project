  /credit-profile-assessment/v1/credit-profile/getCreditProfileReport:
    post:
      tags:
      - Credit Profile Assessment
      summary: Generate Credit Profile Report (JSON)
      description: 'Generates a comprehensive credit profile assessment report based on the customer''s

        Open Banking transaction data. Returns detailed JSON response with score breakdown,

        financial metrics, and recommendations.

        '
      operationId: getCreditRiskReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/credit_profile_assessment_CreditProfileRequest'
            examples:
              basic:
                summary: Basic Request
                value:
                  psuId: PSU123456
                  accountLinkId: consent-uuid-123
                  accountId: SA0380000000608010167519
                  customerType: RETAIL
              withPurpose:
                summary: Request with Loan Purpose
                value:
                  psuId: PSU123456
                  accountLinkId: consent-uuid-123
                  accountId: SA0380000000608010167519
                  customerType: RETAIL
                  purpose: PERSONAL_FINANCE
                  requestedAmount: 50000
                  loanTermMonths: 36
                  annualInterestRate: 3
                  age: 35
      responses:
        '200':
          description: Credit profile report generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/credit_profile_assessment_CreditProfileReportResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/credit_profile_assessment_ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/credit_profile_assessment_ErrorResponse'
      security:
      - OAuth2:
        - credit_profile_assessment
  /credit-profile-assessment/v1/credit-profile/getCreditProfileReport/v2/pdf:
    post:
      tags:
      - Credit Profile Assessment
      summary: Generate Credit Profile Report (PDF V2 - 8 pages)
      description: 'Generates an enhanced 8-page PDF credit profile report with:

        - Page 1: Executive Summary

        - Page 2: Credit Score Component Breakdown

        - Page 3: Financial Health Indicators

        - Page 4: Transaction Analysis

        - Page 5: Loan Exposure & Debt Profile

        - Page 6: Behavior Analysis

        - Page 7: Monthly Breakdown

        - Page 8: Final Recommendation (with Purpose Assessment)

        '
      operationId: getCreditProfileReportPdfV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/credit_profile_assessment_CreditProfileRequest'
      responses:
        '200':
          description: PDF V2 report generated successfully
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              description: Attachment filename
              schema:
                type: string
                example: attachment; filename="credit-profile-report-v2-SA038-abc12345.pdf"
        '400':
          description: Invalid request parameters
        '500':
          description: Internal server error
      security:
      - OAuth2:
        - credit_profile_assessment
