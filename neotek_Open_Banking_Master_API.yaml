        Amount:
          type: number
          example: 1050.5
          description: Amount credited. Excluded if DebitAmount is provided. (Mutually exclusive)
        Balance:
          type: number
          example: 1050.5
          description: Amount debited. Excluded if CreditAmount is provided. (Mutually exclusive)
