      example: '154581853470993793600321149731'
    single_api_aggregator_AccountHolderName:
      title: AccountHolderName
      description: "* /accounts resource\nThe Account Holder Name is the name or names of the Account owner(s) represented at the account level\n\n* /accounts/{AccountId} resource\nThe Account Holder Name is the name or names of the Account owner(s) represented at the account level\n\n* /beneficiaries resource\nThe Account Holder Name is the name or names of the Beneficiary account owner(s) represented at the account level, as displayed by the Creditor Agent's online channels and as provided by the Beneficiary to the PSU 1 when adding the Beneficiary in the Beneficiary list. \nNote, the Account Holder Name is not the product name or the nickname of the account.              \n\n* /scheduled-payments resource\nThe Account Holder Name is the name or names of the Beneficiary account owner(s) represented at the account level, as displayed by the Creditor Agent's online channels and as provided by the Beneficiary to the PSU 1 when adding the Beneficiary in the Beneficiary list. \nNote, the Account\
        \ Holder Name is not the product name or the nickname of the account.              \n\n* /standing-orders resource\nThe Account Holder Name is the name or names of the Beneficiary account owner(s) represented at the account level, as displayed by the Creditor Agent's online channels and as provided by the Beneficiary to the PSU 1 when adding the Beneficiary in the Beneficiary list. \nNote, the Account Holder Name is not the product name or the nickname of the account.   \n"
      type: string
    single_api_aggregator_AccountHolderShortName:
      title: AccountHolderShortName
      type: string
      description: '* /accounts resource

        The Account holder nick name


        * /accounts/{AccountId} resource

        The Account holder nick name


        * /beneficiaries resource

        The Beneficiary account holder nick name


        * /scheduled-payments resource

        The Beneficiary account holder nick name


        * /standing-orders resource

        The Beneficiary account holder nick name       type: string

        '
