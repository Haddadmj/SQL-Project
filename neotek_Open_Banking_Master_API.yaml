        Identification:
          $ref: '#/components/schemas/single_api_aggregator_Identification_0'
    single_api_aggregator_IdentificationType_0:
      title: IdentificationType_0
      description: Name of the identification scheme for the account. Encoded with allowable values published in an external list.
      type: string
      enum:
      - KSAOB.IBAN
      - KSAOB.MaskedPAN
    single_api_aggregator_Identification_0:
      title: Identification_0
      type: string
      minLength: 1
      maxLength: 256
