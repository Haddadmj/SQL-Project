          - Refund
          - Withdrawal
          - Withdrawal Reversal
          - Deposit
          - Deposit Reversal
          - Money Transfer
          - Not Applicable
          example: Purchase
        TransactionDateTime:
          description: 'The Date Time of when the transaction occurred. All dates in the JSON payloads are represented in ISO 8601 date-time format. All date-time fields in responses must include the timezone. An example is below: 2017-04-05T10:43:07+00:00'
          type: string
          format: date-time
        TransactionDateValue:
          description: 'The Date Time of when the transaction valued. All dates in the JSON payloads are represented in ISO 8601 date-time format. All date-time fields in responses must include the timezone. An example is below: 2017-04-05T10:43:07+00:00'
          type: string
          format: date-time
        TransactionHijriDate:
          type: string
          example: '2023-12-04T08:05:50.991+00:00'
        TransactionDescription:
          type: string
          example: COSTA COFFEE
        CreditDebitIndicator:
