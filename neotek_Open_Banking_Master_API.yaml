      title: AccountStatus
      type: string
      description: Specifies the status of account resource in code form.
      example: Active
      enum:
      - Active
      - NotActive
      - Dormant
      - Unclaimed
      - Deceased
      - Suspended
      - Closed
    single_api_aggregator_StatusUpdateDateTime:
      title: StatusUpdateDateTime
      description: Date and time at which the resource status was updated.
      type: string
      format: date-time
      example: '2024-03-05T08:20:37.034Z'
    single_api_aggregator_Currency:
      title: Currency
      description: "Identification of the currency in which the account is held. \nUsage: Currency should only be used in case one and the same account number covers several currencies\nand the initiating party needs to identify which currency needs to be used for settlement on the account."
      type: string
      example: SAR
    single_api_aggregator_AccountType:
      title: AccountType
      description: Specifies the type of account (Retail or Corporate).
      type: string
      example: KSAOB.Retail
    single_api_aggregator_AccountSubType:
      title: AccountSubType
      description: Specifies the sub type of account (product family group).
      type: string
      example: CurrentAccount
    single_api_aggregator_Description:
      title: Description
      description: Specifies the description of the specific resource.
      type: string
    single_api_aggregator_Nickname:
      title: Nickname
      description: The nickname of the account, assigned by the account owner in order to provide an additional means of identification of the account.
      type: string
    single_api_aggregator_OpeningDate:
      title: OpeningDate
      description: Date on which the resource and related basic services are effectively operational for the resource owner.
      type: string
      format: date-time
      example: '2024-03-05T08:20:37.034Z'
    single_api_aggregator_MaturityDate:
      title: MaturityDate
      description: Maturity date of the resource.
      type: string
      format: date-time
      example: '2024-03-05T08:20:37.034Z'
    single_api_aggregator_IdentificationType:
      title: IdentificationType
      description: Name of the identification scheme for the account. Encoded with allowable values published in an external list.
      type: string
    single_api_aggregator_Identification:
      title: Identification
      description: Identification for the account assigned by the PASP based on the Account Scheme Name. This identification is known by the PSU 1 account owner.
      type: string
    single_api_aggregator_Name:
      title: Name
      description: 'The account name is the name or names of the PSU 1 account owner(s) represented at an account level, as displayed by the PASP''s online channels. Note: The account name is not the product name or the nickname of the account.'
      type: string
    single_api_aggregator_BalanceType:
      title: BalanceType
      description: BalanceType
      type: string
      example: KSAOB.ClosingAvailable
      enum:
      - KSAOB.ClosingAvailable
      - KSAOB.ClosingBooked
      - KSAOB.ClosingCleared
      - KSAOB.Expected
      - KSAOB.ForwardAvailable
      - KSAOB.Information
      - KSAOB.InterimAvailable
      - KSAOB.InterimBooked
      - KSAOB.InterimCleared
      - KSAOB.OpeningAvailable
      - KSAOB.OpeningBooked
      - KSAOB.OpeningCleared
      - KSAOB.PreviouslyClosedBooked
    single_api_aggregator_DirectDebitId:
      title: DirectDebitId
      type: string
      description: A unique and immutable identifier used to identify the direct debit resource. This identifier has no meaning to the account owner.
    single_api_aggregator_MandateIdentification:
      title: MandateIdentification
      type: string
      description: This is the unique and immutable reference to the PSU 1 for the Direct Debit mandate.
    single_api_aggregator_DirectDebitStatusCode:
      title: DirectDebitStatusCode
      type: string
      description: 'Specifies the status of the direct debit. Encoded with allowable values of: ''Active'', ''Inactive'''
      example: KSAOB.Annual
      enum:
      - Active
      - Inactive
    single_api_aggregator_Frequency:
      title: Frequency
      type: string
      description: Specifies the frequency of the Direct Debit collections to the PSU 1 account.
      example: KSAOB.Annual
      enum:
      - KSAOB.Annual
      - KSAOB.Daily
      - KSAOB.Fortnightly
      - KSAOB.HalfYearly
      - KSAOB.Monthly
      - KSAOB.NotKnown
      - KSAOB.Quarterly
      - KSAOB.Weekly
    single_api_aggregator_PreviousPaymentDateTime:
      title: PreviousPaymentDateTime
      description: The date of most recent direct debit collection to the PSU 1 account.
      type: string
      format: date-time
      example: '2024-03-05T08:20:37.034Z'
    single_api_aggregator_PreviousPaymentAmount:
      title: PreviousPaymentAmount
      type: object
      description: This is the value of the last direct debit collection from the PSU 1 account.
      properties:
        Amount:
          $ref: '#/components/schemas/single_api_aggregator_Amount'
        Currency:
          $ref: '#/components/schemas/single_api_aggregator_Currency'
    single_api_aggregator_Amount:
      title: Amount
      type: string
      description: A number of monetary units specified in an active currency where the unit of currency is explicit and compliant with ISO 4217.
      pattern: ^\d{1,13}$|^\d{1,13}\.\d{1,5}$
      example: '1500.50'
    single_api_aggregator_BeneficiaryId:
      title: BeneficiaryId
      type: string
      description: A unique and immutable identifier used to identify the beneficiary resource. This identifier has no meaning to the account owner.
    single_api_aggregator_BeneficiaryType:
      title: BeneficiaryType
      type: string
      description: 'Specifies the Beneficiary Type. Encoded with allowable values of: ''Activated'' - Beneficiary has been added to the beneficiary list using SCA. ''NotActivated'' - Beneficiary has been added to the beneficiary list without SCA'
      example: KSAOB.Activated
      enum:
      - KSAOB.Activated
      - KSAOB.NotActivated
    single_api_aggregator_Reference:
      title: Reference
      type: string
      description: 'Unique reference in the context of the creditor, provided by the creditor to the PSU1 (Debtor), to unambiguously refer to the payment transaction. Usage: If available, the initiating party (i.e. Debtor) provides this reference in the structured remittance information, to enable reconciliation by the Creditor upon receipt of the amount of money. This field is populated by the PSU 1 (who is the initiating party of the payment e.g. the Debtor). Field is free format text'
    single_api_aggregator_SupplementaryData:
      title: SupplementaryData
      type: object
      properties: {}
      additionalProperties: true
      description: Additional information that can not be captured in the structured fields and/or any other specific block.
    single_api_aggregator_CreditorDebtorAgent:
      title: CreditorDebtorAgent
      type: object
      description: "* Creditor: \"Party that manages the account on behalf of the account owner, that is manages the registration and booking of entries on the account, calculates balances on the account and provides information about the account.\\nThis is the servicer of the beneficiary account.\"\n* Debotr: \"Financial institution servicing an account for the Debtor in case the transaction is a Credit transaction.\n  These are optional because there are situations where this cannot be populated for the following Credit transactions\n  - cash deposits (no creditor account/agent)\n  - cheques and DDs may not have this information at least during the process of clearing and sometimes (e.g. for agency banks) may not be reconciled ever\n  - some corner situations with international payments \n  - for refunds with card payments  (instead merchant information fields should be populated)\"\n"
      properties:
        IdentificationType:
          $ref: '#/components/schemas/single_api_aggregator_IdentificationType'
        Identification:
          $ref: '#/components/schemas/single_api_aggregator_Identification'
        Name:
          $ref: '#/components/schemas/single_api_aggregator_Name'
        PostalAddress:
          $ref: '#/components/schemas/single_api_aggregator_PostalAddress'
    single_api_aggregator_BenefCreditorAccount:
      title: BenefCreditorAccount
      type: object
      description: Provides the details to identify the beneficiary account.
      properties:
        IdentificationType:
          $ref: '#/components/schemas/single_api_aggregator_IdentificationType'
        Identification:
          $ref: '#/components/schemas/single_api_aggregator_Identification'
    single_api_aggregator_PostalAddress:
      type: object
      description: Postal Address specifies Information that locate and identify a specific address, as defined by postal services.
      properties:
        AddressType:
          $ref: '#/components/schemas/single_api_aggregator_AddressTypeCode'
        ShortAddress:
          $ref: '#/components/schemas/single_api_aggregator_ShortAddress'
        BuildingNumber:
          $ref: '#/components/schemas/single_api_aggregator_BuildingNumber'
        UnitNumber:
          $ref: '#/components/schemas/single_api_aggregator_UnitNumber'
        StreetName:
          $ref: '#/components/schemas/single_api_aggregator_StreetName'
        SecondaryNumber:
          $ref: '#/components/schemas/single_api_aggregator_SecondaryNumber'
        District:
          $ref: '#/components/schemas/single_api_aggregator_District'
        PostalCode:
          $ref: '#/components/schemas/single_api_aggregator_PostalCode'
        City:
          $ref: '#/components/schemas/single_api_aggregator_City'
        Country:
          $ref: '#/components/schemas/single_api_aggregator_Country'
    single_api_aggregator_AddressTypeCode:
      title: AddressTypeCode
      description: Postal Address type specifies the the nature of the postal address.
      type: string
    single_api_aggregator_ShortAddress:
      title: ShortAddress
      description: 8 character Unique alphanumeric Code.
      type: string
    single_api_aggregator_BuildingNumber:
      title: BuildingNumber
      description: Number that identifies the position of a building on a street.
      type: string
    single_api_aggregator_UnitNumber:
      title: UnitNumber
      description: This is the unit number of the business premises or dwelling
      type: number
      example: 10
    single_api_aggregator_StreetName:
      title: StreetName
      description: Name of a street or thoroughfare.
      type: string
    single_api_aggregator_SecondaryNumber:
      title: SecondaryNumber
      description: Secondary Number, if required
      type: string
    single_api_aggregator_District:
      title: District
      description: Identifies the District of a City
      type: string
    single_api_aggregator_PostalCode:
      title: PostalCode
      description: Identifier consisting of a group of letters and/or numbers that is added to a postal address to assist the sorting of mail.
      type: string
    single_api_aggregator_Country:
      title: Country
      description: Identifies a county either by full name or country code
      type: string
    single_api_aggregator_City:
      title: City
      description: Identifies the City of a Country
      type: string
    single_api_aggregator_TransactionId:
      title: TransactionId
      description: Unique identifier for the transaction within an servicing institution. This identifier is both unique and immutable.
      type: string
    single_api_aggregator_TransactionDateTime:
      title: TransactionDateTime
      description: "The Date Time of when the transaction occurred.\nAll dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone. \n"
      type: string
      format: date-time
      example: '2024-03-05T08:20:37.034Z'
    single_api_aggregator_LocalTimeZone:
      title: LocalTimeZone
      description: "The UTC offset of the local date and time of where the transaction occurred\nE.g. UTC+03:00      \n"
      type: string
      format: date-time
    single_api_aggregator_StatementReference:
      description: Unique reference for the statement. This reference may be optionally populated if available.
      type: string
    single_api_aggregator_TransactionReference:
      description: "Unique reference for the transaction.\nWhen processed through a national payment system, it is mandatory to be populated by the PASP.\nAs an example, it may be a reference code for the local payment scheme e.g. mada, SARIE.\"      \n"
      type: string
    single_api_aggregator_TransactionType:
      title: TransactionType
      description: The type of transaction
      type: string
      example: KSAOB.POS
      enum:
      - KSAOB.POS
      - KSAOB.ECommerce
      - KSAOB.ATM
      - KSAOB.BillPayments
      - KSAOB.LocalBankTransfer
      - KSAOB.SameBankTransfer
      - KSAOB.InternationalTransfer
      - KSAOB.Teller
    single_api_aggregator_SubTransactionType:
      title: SubTransactionType
      description: The sub-type of a transaction
      type: string
      example: KSAOB.Purchase
      enum:
      - KSAOB.Purchase
      - KSAOB.Reversal
      - KSAOB.Refund
      - KSAOB.Withdrawal
      - KSAOB.WithdrawalReversal
      - KSAOB.Deposit
      - KSAOB.DepositReversal
      - KSAOB.MoneyTransfer
      - KSAOB.NotApplicable
    single_api_aggregator_TerminalId:
      description: ID of the Terminal if the transaction was initiated from a retail POS
      type: integer
    single_api_aggregator_Flags:
      title: Flags
      description: The flag of a transaction
      type: string
      example: KSAOB.Cashback
      enum:
      - KSAOB.Cashback
      - KSAOB.Payroll
      - KSAOB.DirectDebit
      - KSAOB.StandingOrder
      - KSAOB.Loan
      - KSAOB.Dividend
    single_api_aggregator_PaymentMode:
      title: PaymentModes
      description: The mode of payment
      type: string
      example: KSAOB.Online
      enum:
      - KSAOB.Online
      - KSAOB.Offline
      - KSAOB.Batch
    single_api_aggregator_CreditDebitIndicator:
      description: Indicates whether the transaction is a credit or a debit entry.
      type: string
      example: KSAOB.Credit
      enum:
      - KSAOB.Credit
      - KSAOB.Debit
    single_api_aggregator_TransactionStatus:
      description: Status of a transaction entry on the books of the account servicer.
      type: string
      example: KSAOB.Booked
      enum:
      - KSAOB.Booked
      - KSAOB.Pending
      - KSAOB.Rejected
    single_api_aggregator_TransactionMutability:
      description: Specifies the Mutability of the Transaction record.
      type: string
      enum:
      - KSAOB.Mutable
      - KSAOB.Immutable
    single_api_aggregator_BookingDateTime:
      description: "Date and time when a transaction entry is posted to an account on the account servicer's books.\nUsage: Booking date is the expected booking date, unless the status is booked, in which case it is the actual booking date.\nAll dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone.\n"
      type: string
      format: date-time
      example: '2024-03-05T08:20:37.034Z'
    single_api_aggregator_ValueDateTime:
      description: "Date and time at which assets become available to the account owner in case of a credit entry, or cease to be available to the account owner in case of a debit transaction entry. \nUsage: If transaction entry status is pending and value date is present, then the value date refers to an expected/requested value date. \nFor transaction entries subject to availability/float and for which availability information is provided, the value date must not be used. In this case the availability component identifies the number of availability days.\nAvailability float refers to the time period between fund deposits and clearing.\nThe float is essentially double-counted money: a paid sum which, due to delays in processing, appears simultaneously in the accounts of the payer and the payee.\nAll dates in the JSON payloads are represented in ISO 8601 date-time format. All date-time fields in responses must include the timezone.\"\n"
      type: string
      format: date-time
      example: '2024-03-05T08:20:37.034Z'
    single_api_aggregator_TransactionInformation:
      description: Further details of the transaction. This is the transaction narrative, which is unstructured text.
      type: string
    single_api_aggregator_CurrencyExchange:
      type: object
      description: Set of elements used to provide details on the currency exchange.
      properties:
        SourceCurrency:
          description: Currency from which an amount is to be converted in a currency conversion. A code allocated to a currency by a Maintenance Agency under an international identification scheme, as described in the latest edition of the international standard ISO 4217 "Codes for the representation of currencies and funds".
          type: string
        TargetCurrency:
          description: Currency into which an amount is to be converted in a currency conversion.A code allocated to a currency by a Maintenance Agency under an international identification scheme, as described in the latest edition of the international standard ISO 4217 "Codes for the representation of currencies and funds".
          type: string
        UnitCurrency:
          description: Currency in which the rate of exchange is expressed in a currency exchange. In the example 1SAR = xxxCUR, the unit currency is SAR.A code allocated to a currency by a Maintenance Agency under an international identification scheme, as described in the latest edition of the international standard ISO 4217 "Codes for the representation of currencies and funds".
          type: string
        ExchangeRate:
          description: 'Factor used to convert an amount from one currency into another. This reflects the price at which one currency was bought with another currency.

            Usage: ExchangeRate expresses the ratio between UnitCurrency and QuotedCurrency (ExchangeRate = UnitCurrency/QuotedCurrency).'
          type: number
        ContractIdentification:
          description: Unique identification to unambiguously identify the foreign exchange contract.
          type: string
        QuotationDate:
          description: "Date and time at which an exchange rate is quoted.All dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
          type: string
          format: date-time
          example: '2024-03-05T08:20:37.034Z'
        InstructedAmount:
          type: object
          description: Amount of money to be moved between the debtor and creditor, before deduction of charges, expressed in the currency as ordered by the initiating party.
          properties:
            Amount:
              $ref: '#/components/schemas/single_api_aggregator_Amount'
            Currency:
              $ref: '#/components/schemas/single_api_aggregator_Currency'
    single_api_aggregator_TransactionCashBalance:
      type: object
      description: Set of elements used to define the balance as a numerical representation of the net increases and decreases in an account after a transaction entry is applied to the account.
      properties:
        CreditDebitIndicator:
          $ref: '#/components/schemas/single_api_aggregator_CreditDebitIndicator'
        Type:
          $ref: '#/components/schemas/single_api_aggregator_BalanceTypeCode'
        Amount:
          type: object
          description: Amount of money of the cash balance after a transaction entry is applied to the account..
          properties:
            Amount:
              $ref: '#/components/schemas/single_api_aggregator_Amount'
            Currency:
              $ref: '#/components/schemas/single_api_aggregator_Currency'
    single_api_aggregator_ChargeIncluded:
      title: ChargeIncluded
      type: boolean
      description: 'If true then the value in the Amount has the ChargeAmount deducted from it

        '
    single_api_aggregator_BalanceTypeCode:
      description: "The type of balance for the account. \nEncoded with allowable values of: 'ClosingAvailable' - end of day balance specifying the amount available to PSU 1 to withdraw or use. \n'ClosingBooked' - end of day balance including value of payments for cheques or payments which have not been cleared yet. \n'ClosingCleared' - end of day balance including value of payments for cheques or payments which have been cleared. \n'Expected' - intra day balance including value of payments for cheques or payments which have been cleared. \n'ForwardAvailable' - intraday balance specifying the amount available to PSU 1 to withdraw or use considering forward dated payments or other intraday payments or cheques that will be clearing to the account. \n'Information' - TBC. \n'InterimAvailable' - intraday balance specifying the amount available to PSU 1 to withdraw or use (most probably real-time.'InterimBooked' - intraday balance including value of payments for cheques or payments which have\
        \ not been cleared yet. \n'InterimCleared' - intraday balance including value of payments for cheques or payments which have been cleared (probably real-time). \n'OpeningAvailable' - start of day balance specifying the amount available to PSU 1 to withdraw or use. \n'OpeningBooked' - start of day balance including value of payments for cheques or payments which have not been cleared yet. \n'OpeningCleared' - start of day balance including value of payments for cheques or payments which have been cleared.\n'PreviouslyClosedBooked' -TBC. \nNote: PASPs support different types for presenting account balance, so this list is used to support different PASP systmes in KSA.\n"
      type: string
      enum:
      - KSAOB.ClosingAvailable
      - KSAOB.ClosingBooked
      - KSAOB.ClosingCleared
      - KSAOB.Expected
      - KSAOB.ForwardAvailable
      - KSAOB.Information
      - KSAOB.InterimAvailable
      - KSAOB.InterimBooked
      - KSAOB.InterimCleared
      - KSAOB.OpeningAvailable
      - KSAOB.OpeningBooked
      - KSAOB.OpeningCleared
      - KSAOB.PreviouslyClosedBooked
    single_api_aggregator_BankTransactionCodeStructure:
      type: object
      description: "#### BankTransactionCode is mandatory (with code specifying the Domain, Family and SubFamily as per External Codes ISO20022) when the ProprietaryBankTransactionCode is absent.        \nSpecifies the domain, the family and the sub-family of the bank transaction code, in a structured and hierarchical format.\nUsage: If a specific family or sub-family code cannot be provided, the generic family code defined for the domain or the generic sub-family code defined for the family should be provided.\n[https://www.iso20022.org/sites/default/files/2022-05/BTC_Codification_31May2022.xls](https://www.iso20022.org/sites/default/files/2022-05/BTC_Codification_31May2022.xls)        \n"
      properties:
        Domain:
          description: Specifies the Domain
          type: string
        DomainCode:
          description: Specifies the Domain Code.
          type: string
        Family:
          description: Specifies the Family
          type: string
        FamilyCode:
          description: Specifies the Family Code
          type: string
        SubFamily:
          description: Specifies the Sub-Family
          type: string
        SubFamilyCode:
          description: Specifies the Sub-family Code
          type: string
    single_api_aggregator_ProprietaryBankTransactionCodeStructure:
      type: object
      description: "#### ProprietaryBankTransactionCode is mandatory when the BankTransactionCode (with code specifying the Domain, Family and SubFamily as per External Codes ISO20022) is absent.       \nSet of elements to fully identify a proprietary bank transaction code\n"
      properties:
        Code:
          description: Proprietary bank transaction code to identify the underlying transaction.
          type: string
        Issuer:
          description: Identification of the issuer of the proprietary bank transaction code.
          type: string
    single_api_aggregator_MerchantDetails:
      type: object
      description: 'Details of the Merchant involved in the transaction.

        Merchant Details are specified only for those merchant categories that are generally expected to originate retail financial transactions

        '
      properties:
        MerchantId:
          description: MerchantId
          type: integer
        MerchantName:
          description: Name by which the merchant is known.
          type: string
        MerchantCategoryCode:
          description: "Category code values are used to enable the classification of merchants into specific categories based on the type of business, trade or services supplied. \nCategory code conforms to ISO 18245, related to the type of services or goods the merchant provides for the transaction.\"\n"
          type: string
    single_api_aggregator_TrxnCreditorDebtorAccount:
      title: TrxnCreditorDebtorAccount
      type: object
      description: "Creditor account details available in case the transaction is a Debit transaction.\nThese are optional because there are situations where this cannot be populated for the following Debit transactions:\n- cash withdrawals (no creditor account/agent)\n- cheques and DDs may not have this information at least during the process of clearing and sometimes (e.g. for agency banks) may not be reconciled ever\n- some corner situations with international payments \n- for card payments (instead merchant information fields should be populated)\n"
      properties:
        IdentificationType:
          $ref: '#/components/schemas/single_api_aggregator_IdentificationType'
        Identification:
          $ref: '#/components/schemas/single_api_aggregator_Identification'
        Name:
          $ref: '#/components/schemas/single_api_aggregator_Name'
    single_api_aggregator_TransactionCardInstrument:
      type: object
      description: Set of elements to describe the card instrument used in the transaction.
      properties:
        CardSchemeName:
          description: Name of the card scheme.
          type: string
          enum:
          - KSAOB.AmericanExpress
          - KSAOB.Diners
          - KSAOB.Discover
          - KSAOB.GCC
          - KSAOB.MasterCard
          - KSAOB.UPI
          - KSAOB.VISA
          - KSAOB.mada
        InstrumentType:
          description: The card instrument type.
          type: string
          enum:
          - KSAOB.ApplePay
          - KSAOB.madaPay
          - KSAOB.Contactless
          - KSAOB.MagStripe
          - KSAOB.Chip
          - KSAOB.Other
        Name:
          description: Name of the cardholder using the card instrument.
          type: string
          minLength: 1
          maxLength: 70
        Identification:
          description: Identification assigned by an institution to identify the card instrument used in the transaction. This identification is known by the account owner, and MUST be masked.
          type: string
          example: 1234********4321
    single_api_aggregator_BillDetails:
      description: Bill Details
      type: object
      properties:
        BillerId:
          description: This should be 'BillerCode' as per SP-SADAD specifications. It is a unique biller identifier within SADAD that could be used by the end-user to refer to a specific SADAD biller (e.g. STC biller code is 001, water services biller code is 015, etc.)
          type: number
        BillNumber:
          description: Unique bill identifier within the account.
          type: string
        BillPaymentType:
          description: 'Indicates whether the bill could be a One-off payment, Recurring payment, Postpaid, Pre-paid, etc. Example values:

            - "KSAOB.Post-Paid"

            - "KSAOB.AdvancePaymentForRoaming"

            - "KSAOB.Recharge"

            - "KSAOB.Renewal"

            - "KSAOB.RoamingDeposit"

            - "KSAOB.One-Off"

            - "KSAOB.RecurringPayment"

            '
          type: string
    single_api_aggregator_PageNumber:
      title: PageNumber
      description: The current page number of the paginated resources.
      type: number
      example: 1
    single_api_aggregator_TotalPages:
      title: TotalPages
      description: The total number of pages of the paginated resources.
      type: number
      example: 10
    single_api_aggregator_PsuInquiry_ErrorResponse:
      type: object
      required:
      - header
      properties:
        header:
          $ref: '#/components/schemas/single_api_aggregator_Error'
    single_api_aggregator_Error:
      type: object
      required:
      - Code
      - Message
      properties:
        Code:
          description: High level textual error code, to help categorize the errors.
          type: string
        Message:
          description: A description of the error that occurred. e.g., 'A mandatory field isn't supplied'.
          type: string
    single_api_aggregator_ScheduledPayment:
      type: object
      required:
      - AccountHoldrName
      - ScheduledPaymentId
      - ScheduledPaymentDateTime
      - ScheduledType
      - InstructedAmount
      properties:
        ProfileId:
          $ref: '#/components/schemas/single_api_aggregator_ProfileId'
        AccountsLinkId:
          $ref: '#/components/schemas/single_api_aggregator_AccountsLinkId'
        FinancialInstitution:
          $ref: '#/components/schemas/single_api_aggregator_FinancialInstitution'
        AccountId:
          $ref: '#/components/schemas/single_api_aggregator_AccountId'
        AccountHolderName:
          $ref: '#/components/schemas/single_api_aggregator_AccountHolderName'
        AccountHolderShortName:
          $ref: '#/components/schemas/single_api_aggregator_AccountHolderShortName'
        ScheduledPaymentId:
          $ref: '#/components/schemas/single_api_aggregator_ScheduledPaymentId'
        ScheduledType:
