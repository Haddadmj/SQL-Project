openapi: 3.0.0
info:
  title: neotek Open Banking - Master API
  version: 1.0.0
  description: 'Combined OpenAPI specification for every neotek Open Banking service: consent and account linking, account aggregation, and all commercial data products. Generated as a master reference; each service also has its own standalone specification.'
servers:
- url: https://api.neotek.sa
  description: Production
- url: https://test.api.neotek.sa
  description: UAT / Sandbox
tags:
- name: Consent and Account Linking
  description: 'The prerequisite APIs every client calls before any commercial product: obtain a bearer token, list participating banks, create a customer''s consent, and check its status.'
- name: Single API Aggregator
- name: Average Balances
- name: Account Insights
- name: Income Verification Plus
- name: E-Statements
- name: Cashflow Report
- name: Credit Profile Assessment
paths:
  /oauth2security/oauth2/token:
    post:
      tags:
      - Consent and Account Linking
      operationId: GenerateOAuthClientCredentialsToken
      summary: Generate Access Token
      description: The first step for any client before calling any neotek Open Banking API. Exchanges a client id and client secret for a bearer token using the OAuth2 Client Credentials grant. Request a separate token per scope, or a space-separated list of scopes if calling multiple services with the same credentials. Use the returned access_token as the authorization header on every subsequent call.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - grant_type
              - client_id
              - client_secret
              - scope
              properties:
                grant_type:
                  type: string
                  enum:
                  - client_credentials
                  example: client_credentials
                client_id:
                  type: string
                  description: Client identifier issued to the integrating application.
                client_secret:
                  type: string
                  description: Client secret issued to the integrating application.
                scope:
                  type: string
                  description: Space-separated list of one or more scopes being requested, e.g. "single_api income_verification cashflow".
                  example: single_api income_verification cashflow
      responses:
        '200':
          description: Token issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauth2_TokenResponse'
        '400':
          description: Invalid request, e.g. missing grant_type or scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauth2_TokenErrorResponse'
        '401':
          description: Invalid client_id or client_secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauth2_TokenErrorResponse'
  /financial-institutions-information/v1/financial-institutions:
    get:
      tags:
      - Consent and Account Linking
      summary: List Financial Institutions
      operationId: TPP-ListFinancialInstitutions
      description: This path is used to list registered financial institutions.
      parameters:
      - $ref: '#/components/parameters/financial_institutions_authorization'
      - $ref: '#/components/parameters/financial_institutions_x-request-id'
      - $ref: '#/components/parameters/financial_institutions_x-auth-date'
      - $ref: '#/components/parameters/financial_institutions_x-customer-ip-address'
      - $ref: '#/components/parameters/financial_institutions_x-customer-user-agent'
      - $ref: '#/components/parameters/financial_institutions_FinancialInstitutionId'
      - $ref: '#/components/parameters/financial_institutions_FinancialInstitutionName'
      - $ref: '#/components/parameters/financial_institutions_IsActive'
      - $ref: '#/components/parameters/financial_institutions_Page'
      responses:
        '200':
          $ref: '#/components/responses/financial_institutions_200ListFinancialInstitutions'
        '400':
          $ref: '#/components/responses/financial_institutions_400Error'
        '401':
          $ref: '#/components/responses/financial_institutions_401Error'
        '403':
          $ref: '#/components/responses/financial_institutions_403Error'
        '405':
          $ref: '#/components/responses/financial_institutions_405Error'
        '406':
          $ref: '#/components/responses/financial_institutions_406Error'
        '429':
          $ref: '#/components/responses/financial_institutions_429Error'
        '500':
          $ref: '#/components/responses/financial_institutions_500Error'
      security:
      - OAuth2:
        - single_api
  /accounts-information/v1/accounts-links:
    post:
      tags:
      - Consent and Account Linking
      operationId: CreateAccountLink
      summary: Create Account Link
      description: Registers a customer's consent for a selected financial institution and initiates the FAPI authorization flow. Returns a RedirectionURL to send the customer to their bank's consent screen.
      security:
      - OAuth2:
        - single_api
      parameters:
      - name: authorization
        in: header
        required: true
        schema:
          type: string
        description: Bearer token.
      - name: x-request-id
        in: header
        required: false
        schema:
          type: string
        description: RFC4122 UID used as a correlation id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/accounts_links_CreateAccountLinkRequest'
      responses:
        '201':
          description: Account Link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accounts_links_CreateAccountLinkResponse'
        '400':
          $ref: '#/components/responses/accounts_links_400Error'
        '401':
          $ref: '#/components/responses/accounts_links_401Error'
        '403':
          $ref: '#/components/responses/accounts_links_403Error'
    get:
      tags:
      - Consent and Account Linking
      operationId: ListAccountLinks
      summary: List Account Links
      description: Returns consent links for a given PSU, with filtering and pagination, used to confirm link status and retrieve the AccountsLinkId needed for product calls.
      security:
      - OAuth2:
        - single_api
      parameters:
      - name: authorization
        in: header
        required: true
        schema:
          type: string
        description: Bearer token.
      - name: x-request-id
        in: header
        required: false
        schema:
          type: string
        description: RFC4122 UID used as a correlation id.
      - name: PSUId
        in: query
        required: true
        schema:
          type: string
        description: Customer identifier. Returns only links belonging to this PSU.
      - name: AccountsLinkId
        in: query
        required: false
        schema:
          type: string
        description: Filter to a specific link by its ID.
      - name: FinancialInstitutionId
        in: query
        required: false
        schema:
          type: string
        description: Filter by institution SWIFT BIC.
      - name: Status
        in: query
        required: false
        schema:
          type: string
        description: 'Comma-separated filter: Active, Pending, Rejected, Revoked, Expired.'
      - name: Page
        in: query
        required: false
        schema:
          type: integer
        description: Page number for paginated results.
      - name: Order
        in: query
        required: false
        schema:
          type: string
          enum:
          - ASC
          - DESC
        description: Sort order.
      responses:
        '200':
          description: List of Account Links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accounts_links_ListAccountLinksResponse'
        '400':
          $ref: '#/components/responses/accounts_links_400Error'
        '401':
          $ref: '#/components/responses/accounts_links_401Error'
