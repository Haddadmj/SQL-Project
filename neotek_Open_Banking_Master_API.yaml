      type: object
      required:
      - AccountsLinkIds
      - PSUId
      properties:
        AccountsLinkIds:
          type: array
          description: Accounts Links Ids List
          items:
            type: string
        PSUId:
          type: string
          description: PSU Identifier
          minLength: 1
          maxLength: 35
          example: '89423413245465123185'
        TransactionType:
          type: string
          description: The type of transaction
          enum:
          - KSAOB.POS
          - KSAOB.ECommerce
          - KSAOB.ATM
          - KSAOB.BillPayments
          - KSAOB.LocalBankTransfer
          - KSAOB.SameBankTransfer
          - KSAOB.InternationalTransfer
          - KSAOB.Teller
          - KSAOB.Cheque
          - KSAOB.Other
          example: KSAOB.BillPayments
        TransactionFromTimestamp:
          type: string
          description: The ISO 8601 Date Time to filter transactions FROM. NB Time component is optional - set to 00:00:00 for just Date. If not provided, will return last 6 months.
          format: date-time
        TransactionToTimestamp:
          type: string
          description: The ISO 8601 Date Time to filter transactions TO. NB Time component is optional - set to 00:00:00 for just Date. If not provided, will return last 6 months.
          format: date-time
        TransactionFromAmount:
          type: number
          description: The amount of money to filter transactions FROM.
          example: 5000
        TransactionToAmount:
          type: number
          description: The amount of money to filter transactions TO.
          example: 120000
        IsCategorized:
          type: boolean
