          example: 0.167
        expenseToIncomeRatio:
          type: number
          format: decimal
          example: 0.567
        incomeVolatility:
          type: number
          format: decimal
          description: Income coefficient of variation
          example: 0.08
        expenseVolatility:
          type: number
          format: decimal
          example: 0.12
        averageBalance:
          type: number
          format: decimal
          example: 25000
        minBalance:
          type: number
          format: decimal
          example: 5000
        maxBalance:
          type: number
          format: decimal
          example: 45000
        behaviorChangeDetected:
          type: boolean
          example: true
        detectedChanges:
          type: array
          items:
            $ref: '#/components/schemas/credit_profile_assessment_BehaviorChange'
        monthlyBreakdowns:
          type: array
          items:
            $ref: '#/components/schemas/credit_profile_assessment_MonthlyBreakdown'
        monthsOfData:
          type: integer
          example: 6
        strengths:
          type: array
          items:
            type: string
          example:
          - Consistent income pattern
          - Low expense volatility
        weaknesses:
          type: array
          items:
            type: string
          example:
          - High debt-to-income ratio
    credit_profile_assessment_BehaviorChange:
      type: object
      properties:
        changeType:
          type: string
          example: HIGH_INCOME_VOLATILITY
        severity:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
