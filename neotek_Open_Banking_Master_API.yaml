    accounts_links_CreateAccountLinkRequest:
      type: object
      required:
      - Data
      properties:
        Data:
          type: object
          required:
          - PSUId
          - FinancialInstitutionId
          - SecurityProfile
          - DataGroups
          properties:
            PSUId:
              type: string
              description: Stable internal customer identifier, consistent across all calls for this customer.
            FinancialInstitutionId:
              type: string
              description: SWIFT BIC of the institution selected by the customer, e.g. RJHISARI.
            SecurityProfile:
              type: string
              enum:
              - Redirection
              description: Consent authorization flow.
            DataGroups:
              type: array
              items:
                $ref: '#/components/schemas/accounts_links_DataGroup'
            AccountTypesList:
              type: array
              items:
                type: string
                enum:
                - KSAOB.Retail
                - KSAOB.Corporate
              description: Restrict consent to Retail or Corporate accounts. Defaults to Retail if omitted.
            AccountSubTypesList:
              type: array
              items:
                type: string
                enum:
                - CurrentAccount
                - Savings
                - CreditCard
                - PrePaidCard
                - EMoney
                - ChargeCard
                - Other
            PurposeList:
              type: array
              items:
                type: string
                enum:
                - Account Aggregation
                - Personal Finance Manager
                - Electronic Verification
                - E-Statement
                - Credit Assessment
                - Tax Filing
                - Enterprise Financial Management
                - Letter Of Guarantee
                - Other
              description: Business purpose for the consent, matching the neotek service being integrated.
            ExpirationDateTime:
              type: string
              format: date-time
              description: Optional consent expiry. Omit for long-lived consent.
            TransactionFromDateTime:
              type: string
              format: date-time
            TransactionToDateTime:
              type: string
              format: date-time
            UserLoginId:
              type: string
              description: User login hint, Decoupled security profile only.
