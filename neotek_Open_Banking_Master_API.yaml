      properties:
        Data:
          type: object
          required:
          - Status
          properties:
            Status:
              type: string
              enum:
              - Requested
              - InProgress
              - Calculating
              - Calculated
              - Completed
              - Failed
              example: Completed
            EStatement:
              type: object
              properties:
                CustomerName:
                  type: string
                  example: Mohamed Tarek Abdullah
                StatementDate:
                  type: string
                  example: '2023-12-04 11:29:45.051'
                BankName:
                  type: string
                  example: Al Rajhi Bank
                FromAmount:
                  type: number
                  example: 1000
                ToAmount:
                  type: number
                  example: 10000
                FromDate:
                  description: 'Specifies the start date and time for the e-statement period. All dates in the JSON payloads are represented in ISO 8601 date-time format. All date-time fields in responses must include the timezone. An example is below: 2017-04-05T10:43:07+00:00'
                  type: string
                  format: date-time
                ToDate:
                  description: 'Specifies the end date and time for the e-statement period. All dates in the JSON payloads are represented in ISO 8601 date-time format. All date-time fields in responses must include the timezone. An example is below: 2017-04-05T10:43:07+00:00'
                  type: string
                  format: date-time
                IBAN:
                  type: string
                  example: SA5065461242986347997949
                AccountNumber:
                  type: string
                  example: '214565487236654566334'
                AccountCurrency:
                  type: string
                  pattern: ^[A-Z]{3,3}$
                  example: SAR
                OpeningBalance:
                  type: number
                  example: 1200
                ClosingBalance:
                  type: number
                  example: 3610
                NumberOfDeposit:
                  type: integer
                  example: 21
                NumberOfWithdraw:
                  type: integer
                  example: 28
                TotalOfDeposit:
                  type: string
                  example: '12'
                TotalOfWithdraw:
                  type: string
                  example: '23'
                AccountType:
                  type: string
                  enum:
                  - KSAOB.Retail
                  - KSAOB.Corporate
                  example: KSAOB.Retail
                Transactions:
                  type: array
                  items:
                    $ref: '#/components/schemas/e_statements_Transaction'
