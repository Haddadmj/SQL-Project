        affordabilityAssessment:
          type: string
          example: May strain finances; consider lower amount
        riskLevel:
          type: string
          enum:
          - Low
          - Medium
          - High
          example: High
    credit_profile_assessment_ReportMetadata:
      type: object
      properties:
        factorsEvaluated:
          type: integer
          example: 8
        factorsSkipped:
          type: integer
          example: 2
        skippedFactorReasons:
          type: array
          items:
            type: string
          example:
          - 'AGE: Age not provided in request'
        weightsRedistributed:
          type: boolean
          example: true
        dataQualityNote:
          type: string
          example: 6 months of transaction data available
    credit_profile_assessment_CustomerType:
      type: string
      enum:
      - RETAIL
      - CORPORATE
      default: RETAIL
      description: Customer type for credit profile assessment
    credit_profile_assessment_LoanPurpose:
      type: string
      enum:
      - PERSONAL_FINANCE
      - CAR_LOAN
      - HOME_MORTGAGE
      - EDUCATION
      - MEDICAL
      - BUSINESS
      - DEBT_CONSOLIDATION
      - TRAVEL
      - WEDDING
      - HOME_IMPROVEMENT
      - OTHER
      description: Purpose of the loan request
    credit_profile_assessment_CreditRatingClass:
      type: string
      enum:
      - AAA
      - AA
      - A
      - BBB
      - BB
      - B
      - CCC
      - CC
      - C
      - D
      description: 'Credit rating classification:

        - AAA (900-1000): Excellent

        - AA (800-899): Very Good

        - A (700-799): Good

        - BBB (600-699): Satisfactory

        - BB (500-599): Fair

        - B (400-499): Marginal

        - CCC (300-399): Weak

        - CC (200-299): Very Weak

        - C (100-199): Extremely Weak

        - D (0-99): Default/Reject

        '
    credit_profile_assessment_RiskFactorType:
      type: string
      enum:
      - AGE
      - INCOME
      - LOAN_PAYMENT
      - SURPLUS_RATIO
      - SALARY_CATEGORY
      - CASH_FLOW
      - DEBT_BURDEN_RATIO
      - BUSINESS_AGE
      - REVENUE_STABILITY
      - REVENUE_TREND
      - OPERATING_EXPENSE_RATIO
      - SUPPLIER_PAYMENT_CONSISTENCY
      - CASH_BUFFER
      - CORPORATE_CASH_FLOW
      - PAYMENT_BEHAVIOR
      description: 'Types of risk factors used in credit profile assessment.

        Retail factors: AGE, INCOME, LOAN_PAYMENT, SURPLUS_RATIO, SALARY_CATEGORY, CASH_FLOW, DEBT_BURDEN_RATIO

        Corporate factors: BUSINESS_AGE, REVENUE_STABILITY, REVENUE_TREND, OPERATING_EXPENSE_RATIO, SUPPLIER_PAYMENT_CONSISTENCY, CASH_BUFFER, CORPORATE_CASH_FLOW, PAYMENT_BEHAVIOR

        '
